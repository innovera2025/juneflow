# Juneflow monorepo workspaces (see Manifest group 5 / PLAN.md section 5)
packages:
  - "apps/*"
  - "packages/*"
  - "tests"

allowBuilds:
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
verifyDepsBeforeRun: false
