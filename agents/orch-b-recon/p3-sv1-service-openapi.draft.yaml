paths:
  # --- SERVICE TICKETS (sales-service.jsx AfterSalesService L22 / TicketDetail L192) -
  /sales/service:
    get:
      tags: [land-sales]
      summary: List after-sales service tickets              # [read]
      description: >-
        Tenant-scoped ticket register (sales-service.jsx list L22). Rows are the
        opaque service_ticket columns (no, unit, customer, channel, category,
        title, priority, status, assignee, opened_date, scheduled_date) PLUS the
        derived warranty-months-remaining (SV-2, read-time from
        sales_unit.transfer_at + 12mo). The tab filters (active/all/high/closed)
        and the technician/category/KPI panels are FE-side over this same list.
      operationId: listServiceTickets
      parameters:
        - $ref: "#/components/parameters/Filter"              # ?filter — SR-no / unit / customer / status / priority / channel
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [land-sales]
      # [write] plain create (NO money — a service ticket posts no cost). Body is the
      #   opaque Entity: { unit_id, customer_id?, channel, category, title, priority,
      #   assignee_user_id?, scheduled_date?, note? }. status defaults 'received'
      #   (SV-3 start state). `no` (SR-YYYY-####) is server-allocated (running-doc).
      #   `warranty` months is DERIVED, never a client input.
      summary: Create service ticket (รับเรื่อง + มอบหมาย)
      operationId: createServiceTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sales/service/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [land-sales]
      summary: Get service ticket detail                      # [read] header + derived warranty-months + status-step; history is derived
      operationId: getServiceTicket
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- STATUS MACHINE (SV-3 · action-ops-not-PUT · TicketDetail buttons L269-272) ---
  /sales/service/{id}/schedule:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [land-sales]
      # [write] * STATUS: received -> scheduled ("มอบหมายช่าง" L269 — assign a
      #   technician + set the appointment). B-149 guard: valid ONLY from 'received'
      #   -> 409 otherwise. Optional body {assignee_user_id?, scheduled_date?}.
      summary: Assign + schedule a service ticket — received -> scheduled (action endpoint)
      description: >-
        Status changes go through action endpoints only (api-contract.md, SV-3).
        Valid only when the ticket is currently 'received'; the pre-state is folded
        into the UPDATE WHERE (B-149) so a concurrent flip 409s.
      operationId: scheduleServiceTicket
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"             # invalid transition (not 'received') — REUSES existing component (L4176)
  /sales/service/{id}/start:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [land-sales]
      # [write] * STATUS: scheduled -> fixing ("เริ่มซ่อม" L270). B-149 guard: valid
      #   ONLY from 'scheduled' -> 409 otherwise.
      summary: Start the repair — scheduled -> fixing (action endpoint)
      operationId: startServiceTicket
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /sales/service/{id}/fix:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [land-sales]
      # [write] * STATUS: fixing -> fixed ("ซ่อมเสร็จ · รอลูกค้ายืนยัน" L271). B-149
      #   guard: valid ONLY from 'fixing' -> 409 otherwise.
      summary: Mark repair complete — fixing -> fixed (action endpoint)
      operationId: fixServiceTicket
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /sales/service/{id}/close:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [land-sales]
      # [write] * STATUS: fixed -> closed ("ปิดงาน + ส่งแบบประเมิน" L272 — closes the
      #   ticket + triggers the customer satisfaction survey). B-149 guard: valid
      #   ONLY from 'fixed' -> 409 otherwise. 'closed' is TERMINAL (L273 disabled).
      #   Optional body {rating?} — the closed-row ★ rating (L116) if captured here.
      summary: Close a service ticket + send survey — fixed -> closed (action endpoint)
      operationId: closeServiceTicket
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

# =============================================================================
# MUTATION / HANDLER NOTES (semantics orch-A/C implements; orch-B verifies)
# =============================================================================
# STATUS-TRANSITION GUARDS (SV-3 · the 4 * ops · B-149 merged optimistic-guard)
#   The status machine is strictly linear: received -> scheduled -> fixing ->
#   fixed -> closed. Each action is valid ONLY from its immediate predecessor;
#   any other current state -> 409 Conflict ({code:INVALID_STATE}).
#
#   Implement each flip with the MERGED B-149 optimistic-guard pattern (proven in
#   inventory.ts approveStockTransfer L908-920, and ap/bank/boq/po/pr/subcon):
#   FOLD THE PRE-STATE INTO THE UPDATE WHERE, never read-then-write:
#
#     UPDATE service_ticket
#        SET status = '<next>'
#      WHERE id = $id
#        AND company_id = $tenant          -- (the scoped TenantDb door force-binds this)
#        AND status = '<predecessor>'      -- the guard: predecessor pre-state
#     RETURNING *;
#     -- 0 rows updated  -> the ticket was not in <predecessor> (already advanced,
#     --                    concurrent flip, or wrong state) -> 409 Conflict.
#     -- 1 row  updated  -> 200 ActionOk { id, status:'<next>' }.
#
#   Per op:
#     schedule : predecessor 'received'  -> 'scheduled'  (optional assignee_user_id +
#                scheduled_date set in the SAME UPDATE)
#     start    : predecessor 'scheduled' -> 'fixing'
#     fix      : predecessor 'fixing'    -> 'fixed'
#     close    : predecessor 'fixed'     -> 'closed'     (terminal; optional rating)
#   This is race-safe (no TOCTOU) and folds a missing/foreign id into the 0-row
#   path — a not-found id also matches 0 rows; if orch-A wants a distinct 404 vs
#   409, do a scoped existence select first, then the guarded UPDATE (mirror the
#   inventory.ts StaleStateError -> conflict() shape).
#
#   FINANCIAL AUTHZ: a service ticket posts NO money, so these are NOT finance
#   mutations — do NOT gate them on finance.create/finance.approve (that would be
#   inventing policy). Gate on the resolved tenant + (if a sales/service perm-module
#   exists in the matrix) its create/update perm; else tenant-scope only. Reads gate
#   on the resolved tenant. AuditLog fires automatically (middleware) on 2xx.
#
# SV-2  WARRANTY DERIVATION (derived-not-stored · NO new column/table)
#   The displayed "Warranty คงเหลือ N เดือน" (list badge + TicketDetail L236 +
#   NewTicketForm readOnly L289) is COMPUTED at read time, never persisted:
#     warranty_months_remaining = max(0, 12 - months_elapsed_since(transfer_at))
#   where transfer_at comes from the sold unit's sales_unit row. Join chain:
#     service_ticket.unit_id -> project_node  <-  sales_unit.unit_id
#       (both FK project_node; match on unit_id within the tenant)
#     read sales_unit.transfer_at (misc.ts L96) -> add 12 months -> remaining vs now.
#   No transfer_at / no sales_unit row -> null/"—" (honest, not an error). The
#   existing service_ticket.warranty boolean stays a covered/expired flag ONLY; do
#   NOT add a warranty_expiry or warranty_months column (SV-2 ruling: derive).
#   Serialize the derived number onto the wire alongside the opaque columns.
#
# SV-5  pm_workorder CROSS-LINK ("สร้างใบงานช่าง (PM)" · L267 — handler note, NOT an op here)
#   The TicketDetail "สร้างใบงานช่าง (PM)" button creates a CM/PM work order FROM the
#   ticket and navigates to pm.wo (L267: notify "สร้างใบงานช่าง CM-PM จาก {no}" +
#   ctx.navigate("pm.wo")). This is a CROSS-MODULE create of a pm_workorder
#   (pm.ts pmWorkOrders L168) — it belongs to the pm.wo write surface, NOT the
#   /sales/service tag, so it is NOT declared as a /sales/service op in this round.
#   When the pm.wo create op is wired, seed the new pm_workorder from the ticket
#   (unit/asset, title, category, assignee) and record the ticket linkage. Until
#   then it is an honest FE-only navigate. Flag for orch-A: confirm whether the pm
#   round already exposes a pm_workorder create op to target, else file a follow-up.
#
# COMPONENT NOTE (fully additive — ZERO new components)
#   Every $ref above already exists in openapi.yaml today (verified): Entity,
#   EntityList, EntityOk, EntityCreated, ActionOk, IdPath, Filter, Page,
#   Unauthorized, NotFound, and Conflict (L4176 — added by the B-141 inventory
#   round; this round REUSES it for the invalid-transition 409). Nothing to add,
#   nothing to remove/rename. The `land-sales` tag already exists (L70). So the SV-1
#   round is a pure paths-block append — orch-A inserts these 7 path items into the
#   §Land/Sales block (after /sales/units/{id}/transfer, openapi.yaml L3509) and
#   registers the service route in app.ts.
#
#   TAG DISCRETION: this draft tags [land-sales] to mirror the sibling /sales/* +
#   /land/* ops. orch-A may consolidate under a different existing tag if it prefers
#   (precedent: the B-141 inventory round shipped under [finance], not the draft's
#   suggested [inventory]) — the op shapes are unaffected.
# =============================================================================
