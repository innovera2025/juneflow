    post:
      tags: [finance]
      summary: Record labor attendance
      operationId: createLaborAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            B-332: caller holds neither finance.create nor a worker record linked to this
            user, or that linked worker record is not active. Self-service check-in may
            record only the caller's OWN worker id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The day is already recorded for this worker — either UNCOSTED
            (attendance_self_day_uq, B-336) or in this same cost centre
            (attendance_costed_day_uq, B-338/B-342); or the supplied idempotency_key was
            already used against a DIFFERENT worker/day. A legitimate REPLAY of the
            caller's own key is never a 409 — it returns the original row's 201, because
            the phone dead-letters a 4xx permanently. The cost-centre SPLIT (two rows, one
            day, different cc_id) is not a conflict and stays 201.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /labor/attendance/checkout:
    post:
      tags: [finance]
      summary: Close a worker's day by stamping check-out onto the existing attendance row (B-332)
      description: >-
        Addresses the row by the CHECK-IN's client idempotency key (check_in_key), not by a
        server-assigned id: the mobile queue mints the key offline before the row exists and
        cannot substitute a server id into a queued op's path. Updates the SAME row - a
        check-out is never a second row, which would carry its own day_fraction and pay the
        day twice. Replaying the identical checked_out_at returns 200 with the original row;
        a different instant on an already-closed day is 409.
        `day` is the CHECK-IN's day, not the check-out's calendar day - it is part of the
        row's address. On a night shift the two differ: a worker who clocks in on the 10th
        and out at 06:00 on the 11th is closed by sending day = the 10th, and sending the
        11th resolves nothing and returns 404. checked_out_at must not be earlier than the
        stored checked_in_at (400).
      operationId: checkoutLaborAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Caller holds neither finance.create nor a worker record linked to this user,
            or that linked worker record is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
