# =============================================================================
# SACRED FILE — changes require Wei approval via BLOCKERS.md
# (PLAN.md section 8/10: OpenAPI contract change goes through Wei ONLY — even
#  the contract owner (Backend/Platform zone) needs approval before merging.)
# =============================================================================
# Single source of the API contract (PLAN.md section 5): FE/Mobile generate
# clients from this file — hand-written models are forbidden.
#
# Derived from: docs/handoff/api-contract.md  (faithful transcription — endpoint
#   set, verbs and action-endpoint pattern come straight from that doc; nothing
#   is invented. Ambiguities go to BLOCKERS.md, never guessed.)
#
# Contract conventions (api-contract.md):
#   - REST · JSON · prefix /api/v1
#   - every request carries Authorization: Bearer <jwt>; the JWT carries
#     company_id = tenant scope (except the inbound LINE webhook, which LINE
#     signs with x-line-signature — see /line/webhook)
#   - standard resource pattern: GET /x?filter&page · GET /x/:id · POST /x ·
#     PUT /x/:id — status changes go through action endpoints ONLY
#     (POST /x/:id/approve), never via direct PUT of a status field
#   - every mutation writes AuditLog automatically (middleware)
#   - attachments: POST /files (multipart) first, then pass file_id — files
#     enter DMS automatically with link_module
#   - all exports are async jobs: POST /exports {type,params} →
#     GET /exports/:id (url when done)
#   - quota middleware (menus/projects/users/storage/AI per package) →
#     402 QUOTA_EXCEEDED + upgrade_url
#
# Modeling notes (transcription, not design decisions):
#   - Resource field shapes are intentionally left opaque (schema `Entity`)
#     except where api-contract.md names fields explicitly. Full field modeling
#     belongs to the data-dictionary schema tasks, not this contract; inventing
#     fields here is forbidden by PLAN.md section 0.
#   - The list/pagination response envelope is NOT specified in api-contract.md.
#     Lists return a bare array (the representative shape) pending Wei's decision
#     on the envelope — see BLOCKERS.md B-014 (non-blocking).

openapi: 3.1.0

info:
  title: Juneflow API
  version: 0.1.0
  description: >-
    Construction ERP + Subscription SaaS (multi-tenant).
    REST, JSON, prefix /api/v1. Every request carries
    "Authorization: Bearer <jwt>"; the JWT carries company_id (tenant scope).
    Status changes go through action endpoints only, never direct PUT.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Auth & tenant (login, password reset, current user)
  - name: admin
    description: Platform Admin — packages, subscribers, users, invoices (system owner)
  - name: master
    description: Master data (projects, project types, vendors, customers, cost centers, doc numbering)
  - name: boq
    description: BOQ / procurement (BOQ docs, AI QTO, PR, PO/WO, GR)
  - name: subcon
    description: Subcontractor / acceptance (contracts, work periods, defects)
  - name: pm
    description: PM (CMMS) — contracts, assets, checklists, work orders, quotes
  - name: finance
    description: Finance-Accounting (AP/AR/GL/Bank/FA/e-Tax/Labor/OPEX)
  - name: land-sales
    description: Land / Sales (plots, leads, bookings, contracts, downs, loans)
  - name: dms
    description: DMS / Notifications / Audit / Reports
  - name: files
    description: File upload (presigned → R2 → DMS)
  - name: exports
    description: Async export jobs
  - name: line
    description: LINE OA webhook
  - name: dashboard
    description: Dashboard (aggregation/read — KPIs, budget vs actual, approvals inbox, alerts, cashflow forecast, contractors)

paths:
  # ============================ Auth & Tenant ================================
  /auth/login:
    post:
      tags: [auth]
      summary: Login (POST /auth/login {email,password})
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: "Authenticated: token + user + company + package."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot:
    post:
      tags: [auth]
      summary: Request password reset (POST /auth/forgot)
      operationId: authForgot
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"

  /auth/reset:
    post:
      tags: [auth]
      summary: Reset password (POST /auth/reset)
      operationId: authReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"

  /me:
    get:
      tags: [auth]
      summary: Current user (GET /me → user + role + approval_limits + package)
      operationId: getMe
      responses:
        "200":
          description: Current user with role, approval limits and package usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      tags: [auth]
      summary: List tenant users (GET /users?filter&page)
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      summary: Invite tenant user (email invite; username generated from email; status starts invited)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /roles:
    get:
      tags: [auth]
      summary: List tenant roles with permission matrix (GET /roles?filter&page)
      operationId: listRoles
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      summary: Create tenant role (name + approval limit + approval level + permission matrix)
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [auth]
      summary: Update tenant role (permission matrix save)
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================ Platform Admin ==============================
  /admin/packages:
    get:
      tags: [admin]
      summary: List packages (S/M/L/Full)
      operationId: listAdminPackages
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [admin]
      summary: Create package ({price,limits,menus[],sub_rules})
      operationId: createAdminPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/packages/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [admin]
      summary: Get package by id
      operationId: getAdminPackage
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Update package (never changes status — use action endpoints)
      operationId: updateAdminPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/subscribers:
    get:
      tags: [admin]
      summary: List subscribers (companies + usage)
      operationId: listAdminSubscribers
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/subscribers/{id}/package:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [admin]
      summary: Change subscriber package (PUT {package_id,seats})
      operationId: setAdminSubscriberPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/subscribers/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin]
      summary: Suspend subscriber (action endpoint)
      operationId: suspendAdminSubscriber
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/subscribers/{id}/notify:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin]
      summary: Notify subscriber (action endpoint)
      operationId: notifyAdminSubscriber
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users:
    get:
      tags: [admin]
      summary: List users (GET /admin/users?company=)
      operationId: listAdminUsers
      parameters:
        - name: company
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/users/{id}/block:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin]
      summary: Block user (action endpoint)
      operationId: blockAdminUser
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin]
      summary: Reset user password (action endpoint)
      operationId: resetAdminUserPassword
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/invoices:
    get:
      tags: [admin]
      summary: List platform invoices
      operationId: listAdminInvoices
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/invoices/{id}/remind:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [admin]
      summary: Send invoice reminder (action endpoint)
      operationId: remindAdminInvoice
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # =============================== Master ===================================
  /companies:
    get:
      tags: [master]
      summary: List the tenant's affiliated group companies (Multi-Company)
      description: >-
        B-041(ก+): the บริษัทในเครือ rows behind the CompanySwitcher
        (company-accept.jsx COMPANIES / PLAN.md Appendix B item 14). Returns
        the members of the tenant's company group — companies linked via
        group_parent_id to the tenant's group head. Tenant-scoped: a tenant
        can only ever see its own group.
      operationId: listCompanies
      responses:
        "200":
          description: >-
            Group company list (B-014 paginated envelope). project_count is
            derived per company from the tenant's project rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects:
    get:
      tags: [master]
      summary: List projects (GET /x?filter&page pattern)
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: >-
            Project list (tenant-scoped, B-014 paginated envelope).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [master]
      summary: Create project (POST /x pattern)
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created (AuditLog written by middleware).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [master]
      summary: Get project by id (GET /x/:id pattern)
      operationId: getProject
      responses:
        "200":
          description: Project (tenant-scoped by company_id from JWT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [master]
      summary: Update project (PUT /x/:id — never changes status)
      description: >-
        Status transitions are NOT allowed here — use action endpoints
        (see /boq/{id}/approve).
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Updated (AuditLog written by middleware).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}/hierarchy:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [master]
      summary: Project hierarchy tree (phase/block/unit)
      operationId: getProjectHierarchy
      responses:
        "200":
          description: Flat ordered tree of hierarchy nodes (phase/block/unit).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HierarchyNode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /org-units:
    get:
      tags: [master]
      summary: List org structure nodes (flat ordered tree, lvl 0-2)
      operationId: listOrgUnits
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [master]
      summary: Create org node (company lvl0 or department/team lvl 1-2)
      operationId: createOrgUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /org-units/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [master]
      summary: Update org node (partial merge - omitted fields keep current values)
      operationId: updateOrgUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [master]
      summary: Delete org node (cascades to the whole subtree)
      operationId: deleteOrgUnit
      responses:
        "200":
          $ref: "#/components/responses/ActionOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/nodes:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [master]
      summary: Create block node under the first/active phase (auto-generates N unit nodes, status empty, max 200)
      operationId: createProjectNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /project-types:
    get:
      tags: [master]
      summary: List project types (hierarchy[], modules{} — Full only)
      operationId: listProjectTypes
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [master]
      summary: Create project type
      operationId: createProjectType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /project-types/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [master]
      summary: Get project type by id
      operationId: getProjectType
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [master]
      summary: Update project type
      operationId: updateProjectType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /vendors:
    get:
      tags: [master]
      summary: List vendors (GET /vendors?kind=supplier|subcon)
      operationId: listVendors
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [supplier, subcon]
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [master]
      summary: Create vendor
      operationId: createVendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /vendors/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [master]
      summary: Get vendor by id
      operationId: getVendor
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [master]
      summary: Update vendor
      operationId: updateVendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /customers:
    get:
      tags: [master]
      summary: List customers
      operationId: listCustomers
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [master]
      summary: Create customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /customers/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [master]
      summary: Get customer by id
      operationId: getCustomer
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [master]
      summary: Update customer
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
      responses:
        "200":
          $ref: "#/components/responses/EntityOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /cost-centers:
    get:
      tags: [master]
      summary: List cost centers
      operationId: listCostCenters
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
