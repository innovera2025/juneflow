  /counts:
    get:
      tags: [dms]
      summary: "Nav badge counts (GET /counts?keys=... → {key: count})"
      description: >-
        Tenant-scoped pending-work counts for the sidebar badges — B-040(ก).
        The 9 keys are the NAV badge sources in pototype chrome.jsx; decision
        C10 forbids hardcoded badge numbers, so each count is a live query
        over the module's pending-state rows (flows.html state machines).
        Counts never escape the JWT's company_id tenant scope.
      operationId: getCounts
      parameters:
        - name: keys
          in: query
          required: true
          style: form
          explode: false
          description: >-
            Comma-separated nav badge ids to count. An unknown key answers
            400 with the flat Error shape.
          schema:
            type: array
            minItems: 1
            items:
              type: string
              enum:
                - boq
                - boq.approval
                - pr.list
                - accept
                - pm.wo
                - gl.inbox
                - sales
                - sales.crm
                - sales.service
      responses:
        "200":
          description: Pending-work count per requested key (tenant-scoped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Counts"
        "400":
          description: Unknown/invalid count key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
