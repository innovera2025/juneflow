components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT carries company_id = tenant scope (api-contract.md).

  parameters:
    Filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: Free-text/structured filter (GET /x?filter&page pattern).
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: 1-based page index (GET /x?filter&page pattern).
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Rows per page (B-014). Server applies a default when omitted.
    Period:
      name: period
      in: query
      required: false
      schema:
        type: string
      description: Accounting period selector (e.g. YYYY-MM).
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing/invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: >-
        Request body failed validation — always code VALIDATION with a message
        naming the offending field. B-311 (Wei = ก, 2026-08-06): declared on the
        two ops that gate a client-supplied idempotency_key, so a generated
        client has a typed branch for a key of the wrong TYPE (B-309: a
        present-but-non-string key is refused rather than silently disabling
        dedup on a money write). NOTE: other ops in this spec also return 400
        without declaring it — this response is reusable so that gap can be
        closed op-by-op without inventing a second shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found within the tenant scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QuotaExceeded:
      description: >-
        Package/AI quota exceeded (quota middleware per
        docs/extract/PACKAGE-RULES.md) — always code QUOTA_EXCEEDED with
        upgrade_url (PLAN.md section 5).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuotaExceededError"
    Conflict:
      description: >-
        State conflict — the action cannot apply against current state (e.g.
        negative stock on transfer-approve / issue post, B-141 B6).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EntityOk:
      description: Resource (tenant-scoped by company_id from JWT).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entity"
    EntityCreated:
      description: Created (AuditLog written by middleware).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entity"
    EntityList:
      description: >-
        Paginated list envelope (B-014, tenant-scoped). data holds the page
        of rows; page/page_size/total are pagination metadata.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Paginated"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entity"
    ActionOk:
      description: >-
        Action applied; any status transition is handled server-side
        (AuditLog written by middleware).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entity"

  schemas:
    Entity:
      type: object
      description: >-
        Opaque resource. Exact fields live in the data-dictionary schema tasks,
        not in this contract transcription — inventing fields here is forbidden
        (PLAN.md section 0). Modeled explicitly only where api-contract.md names
        fields (e.g. AuthLoginInput).
      additionalProperties: true

    HierarchyNode:
      type: object
      description: >-
        One node of a project's structure tree (B-053). kind follows the
        project type's hierarchy labels; unit nodes carry sale/build status.
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [phase, block, unit]
        code:
          type: string
        name:
          type: string
        model_id:
          type: string
          format: uuid
        units:
          type: integer
          minimum: 0
        sold:
          type: integer
          minimum: 0
        built:
          type: integer
          minimum: 0
        color:
          type: string
        status:
          type: string
      additionalProperties: true
    Paginated:
      type: object
      description: >-
        Standard list envelope (B-014). Every list endpoint returns this
        wrapper: data is the page of rows (item type set per endpoint via
        allOf), the rest is pagination metadata. Tenant scope still applies.
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          example: 20
        total:
          type: integer
          minimum: 0
          example: 137
    Error:
      type: object
      description: Standard error envelope.
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    QuotaExceededError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [upgrade_url]
          properties:
            code:
              type: string
              enum: [QUOTA_EXCEEDED]
            upgrade_url:
              type: string
              format: uri

    Job:
      type: object
      description: Async job handle (AI QTO / exports). url present when done.
      properties:
        job_id:
          type: string
        id:
          type: string
        status:
          type: string
        url:
          type: string
          format: uri
      additionalProperties: true

    FileUploaded:
      type: object
      description: Result of POST /files — pass file_id to the owning endpoint.
      required: [file_id]
      properties:
        file_id:
          type: string
          format: uuid
        link_module:
          type: string
        url:
          type: string
          format: uri

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthLoginResult:
      type: object
      description: "POST /auth/login result: token + user + company + package."
      required: [token]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/Entity"
        company:
          $ref: "#/components/schemas/Entity"
        package:
          $ref: "#/components/schemas/Entity"

    Me:
      type: object
      description: "GET /me: user + role + approval_limits + package{menus,limits,ai_used}."
      properties:
        user:
          $ref: "#/components/schemas/Entity"
        role:
          $ref: "#/components/schemas/Entity"
        approval_limits:
          $ref: "#/components/schemas/Entity"
        package:
          $ref: "#/components/schemas/Entity"

    Counts:
      type: object
      description: >-
        GET /counts result — pending-work count per requested nav badge key
        (B-040(ก)). Keys mirror the request's keys parameter; every value is a
        tenant-scoped live query count (decision C10 — never hardcoded).
      required: [counts]
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0

    Company:
      type: object
      description: >-
        An affiliated group company (บริษัทในเครือ) — B-041(ก+). short/color/
        biz/doc_prefix are the Multi-Company switcher fields from
        company-accept.jsx COMPANIES (Appendix B item 14); project_count is
        derived from the tenant's project rows attributed to the company.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        short:
          type: string
        color:
          type: string
        biz:
          type: string
        tax_id:
          type: string
        doc_prefix:
          type: string
        project_count:
          type: integer
          minimum: 0

    ProjectPhase:
      type: object
      description: >-
        A phase row of a project (project_node kind=phase) — B-041(ก+).
        units = unit-kind nodes under the phase; sold_pct = round(100 ×
        sold-or-transferred sales units / units); sale_status is the phase
        node's own sale status (nullable free text).
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        units:
          type: integer
          minimum: 0
        sold_pct:
          type: integer
          minimum: 0
          maximum: 100
        sale_status:
          type: string

    Project:
      type: object
      description: >-
        Minimal placeholder per data-dictionary Project (name, type, budget,
        status). Full field modeling belongs to the schema tasks.
        short / color / company_id / units / phases are the B-041(ก+) approved
        ProjectSwitcher extensions (chrome.jsx PROJECTS): short/color are
        stamped master columns (migration 0009); company_id is the owning
        company; units / phases are derived from project_node + sales_unit.
      required: [id, name, type, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [realestate, solar, civil, service]
        budget:
          type: number
        currency_code:
          type: string
          description: Every money value carries currency_code (PLAN.md section 4).
        status:
          type: string
        short:
          type: string
        color:
          type: string
        company_id:
          type: string
          format: uuid
        units:
          type: integer
          minimum: 0
        phases:
          type: array
          items:
            $ref: "#/components/schemas/ProjectPhase"

    ProjectInput:
      type: object
      description: "Project create/update input (fields per data-dictionary)."
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [realestate, solar, civil, service]
        budget:
          type: number
        currency_code:
          type: string
        short:
          type: string
        units:
          type: integer
          minimum: 0
        phases:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              units:
                type: integer
                minimum: 0
