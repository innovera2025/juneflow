  /gr:
    get:
      tags: [boq]
      summary: List goods receipts
      operationId: listGr
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [boq]
      summary: Goods receipt ({po_id,lines[{qty_ok,qty_rejected,photos[]}]}) — rejects gen defect-report
      operationId: createGr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                po_id:
                  type: string
                  format: uuid
                wo_id:
                  type: string
                  format: uuid
                  description: Alternative to po_id — GR against a work order (B-070 GR-from-WO)
                idempotency_key:
                  type: string
                  format: uuid
                  description: >-
                    Client-generated idempotency key (B-261). A create whose key was
                    already seen returns the ORIGINAL receipt (2xx, no duplicate row) —
                    makes the mobile offline-queue at-least-once replay safe. Omit → no dedup.
                warehouse_id:
                  type: string
                  format: uuid
                  description: >-
                    B-340: destination warehouse for the received goods. REQUIRED when any
                    line carries item_id — that pair is what writes the +qty stock_ledger
                    movement (ref_doc `gr:<id>`). A receipt with neither is recorded exactly
                    as before and moves no stock. Must resolve inside this tenant, else 400.
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      qty_ok:
                        type: number
                      qty_rejected:
                        type: number
                      item_id:
                        type: string
                        format: uuid
                        description: >-
                          B-340: the inventory_item this line receives. Present (with a
                          body-level warehouse_id) → a +qty_ok stock_ledger movement is
                          written; absent → the line is recorded but moves no stock.
                          DISTINCT from boq_item_id, which links the BOQ line and does NOT
                          identify stock — the two catalogues genuinely diverge (BOQ
                          MAT-WIRE-22 vs inventory MAT-WIRE-25, same name, different code),
                          so one is never inferred from the other. Rejected qty is not
                          received into stock; only qty_ok moves.
                      boq_item_id:
                        type: string
                        format: uuid
                        description: BOQ item this line receives (F1 gr_item per-line)
                      name:
                        type: string
                      ordered_qty:
                        type: number
                      unit:
                        type: string
                      price:
                        type: number
                      photos:
                        type: array
                        items:
                          type: string
      responses:
        "201":
          $ref: "#/components/responses/EntityCreated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

