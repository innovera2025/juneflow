# infra/docker-compose.yml — Juneflow dev stack
# Phase 0 milestone (PLAN.md §5/§7 + Manifest group 5): a single `docker compose up`
# yields the full running system (pg16 + redis + api + web + worker) ALREADY SEEDED
# ("up เดียว+seed"). Task: TASKS.md P0-DEV-01 (depends on P0-BE-10 seed, P0-BE-13 api skeleton).
#
# Build contexts are the MONOREPO ROOT (`..`) with an explicit `dockerfile:` — the
# apps/api and apps/web Dockerfiles both do a workspace-wide `pnpm install`, so they
# MUST see the whole repo (pnpm-lock.yaml + every package), not just their own dir.
#
# Secrets rule (infra/CLAUDE.md): no secrets in this repo — everything enters via
# infra/.env (git-ignored) or host env. Values below are dev-only defaults.
#
# Intra-stack DB/Redis URLs are DERIVED from the POSTGRES_* vars (same source of
# truth as the postgres service) with the internal service host/port pinned
# (`postgres:5432`, `redis:6379`). They deliberately do NOT fall through to a bare
# `${DATABASE_URL}`/`${REDIS_URL}`: a dev/CI host commonly exports DATABASE_URL
# pointing at a host-local Postgres (e.g. 127.0.0.1:5433), and `${DATABASE_URL:-…}`
# would let that host value override the in-network target and break `docker
# compose up` (services can't reach a host loopback port from inside the stack).
# Password still comes from POSTGRES_PASSWORD (infra/.env), so the secrets rule holds.
# For a real external DB, edit these here or use infra/docker-compose.prod.yml.

name: juneflow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juneflow}
      POSTGRES_USER: ${POSTGRES_USER:-juneflow}
      # Dev-only default password — real value must come from infra/.env, never committed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-juneflow-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juneflow} -d ${POSTGRES_DB:-juneflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migrate + seed. Runs to completion then exits 0; api/worker wait for it.
  # This is what guarantees "docker compose up" alone produces a seeded, clickable
  # system comparable against pototype/gallery (Manifest group 5 / PLAN.md §7 Phase 0).
  #
  # Uses the api Dockerfile `build` target (not `runtime`): migrate needs drizzle-kit
  # and seed needs tsx + packages/db source — both are devDeps present only in the
  # build stage (the runtime stage is a `pnpm deploy --prod` that strips them).
  # packages/db exposes `migrate` (drizzle-kit migrate) and `seed` (tsx src/seed);
  # both read DATABASE_URL from env (packages/db/drizzle.config.ts + seed/index.ts).
  # Seed is idempotent: one TRUNCATE+INSERT transaction, so data persists and counts
  # stay 1:1 on restart — no reseed-on-reload (PLAN.md §0 rule 3).
  migrate-seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    image: juneflow-api-build:dev
    env_file:
      - path: ./.env
        required: false # create infra/.env locally (never commit it)
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-juneflow}:${POSTGRES_PASSWORD:-juneflow-dev}@postgres:5432/${POSTGRES_DB:-juneflow}
      # B-224: pass-through so the G5 visual gate can freeze the seed clock (empty default = no-op -> new Date()).
      SEED_FROZEN_NOW: ${SEED_FROZEN_NOW:-}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["sh", "-c", "pnpm --filter @juneflow/db migrate && pnpm --filter @juneflow/db seed"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: juneflow-api:dev
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-juneflow}:${POSTGRES_PASSWORD:-juneflow-dev}@postgres:5432/${POSTGRES_DB:-juneflow}
      REDIS_URL: redis://redis:6379
      # B-224: aligns the aging DISPLAY clock (business-clock.ts) with a frozen seed for the G5 gate (empty default = no-op -> Date.now()).
      SEED_FROZEN_NOW: ${SEED_FROZEN_NOW:-}
      # Dev-only default secret — real value must come from infra/.env, never committed.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-juneflow-dev-secret}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate-seed:
        condition: service_completed_successfully
    # /health endpoint from the Fastify skeleton (apps/api/src/index.ts:72). node:22
    # ships a global fetch, so no extra probe binary is needed in the runtime image.
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # BullMQ worker — same image as api, different command (PLAN.md §5: async jobs
  # export / e-Tax / notification / PM schedule gen). The api Dockerfile documents
  # this exact override: worker CMD = ["node", "dist/worker.js"].
  worker:
    image: juneflow-api:dev
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-juneflow}:${POSTGRES_PASSWORD:-juneflow-dev}@postgres:5432/${POSTGRES_DB:-juneflow}
      REDIS_URL: redis://redis:6379
      # B-224: aligns the aging DISPLAY clock (business-clock.ts) with a frozen seed for the G5 gate (empty default = no-op -> Date.now()).
      SEED_FROZEN_NOW: ${SEED_FROZEN_NOW:-}
      # Dev-only default secret — real value must come from infra/.env, never committed.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-juneflow-dev-secret}
    depends_on:
      redis:
        condition: service_started
      migrate-seed:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: ["node", "dist/worker.js"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
