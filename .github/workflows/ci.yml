# Juneflow CI — Bootstrap Manifest v2 group 4.3 + PLAN.md §9/§10
#
# Stage order mirrors the 5 verification gates (PLAN.md §9):
#   lint+typecheck -> migration check -> contract tests -> unit -> E2E (Playwright) -> visual gate
#
# Scaffold tolerance: every stage guards its steps with hashFiles() and
# `pnpm run --if-present` so the pipeline is GREEN from day one, before
# P0-BE-01 lands. As each workspace/script appears, its stage starts running
# for real without touching this file.
#
# Branch flow (PLAN.md §10): feature -> dev (auto-merge when CI is green)
#                            -> main (Wei promotes MANUALLY, alone).
# main is LOCKED: no automation in this workflow (or anywhere else) pushes to
# main — enforce with GitHub branch protection on main. Only Wei promotes
# dev -> main.
#
# NOTE: this file is a sacred file after merge (PLAN.md §10) — changes only
# via an approved entry in BLOCKERS.md.

name: CI

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with root package.json "engines.node" (>=22).
  NODE_VERSION: "22"
  # Keep in sync with root package.json "packageManager" (pnpm@11.5.0) —
  # pnpm/action-setup@v4 hard-errors when this conflicts with that field.
  PNPM_VERSION: "11.5.0"

jobs:
  lint-typecheck:
    name: "Stage 1 — lint + typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Lint
        if: hashFiles('package.json') != ''
        run: pnpm run --if-present lint
      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: pnpm run --if-present typecheck
      - name: Pre-scaffold pass
        if: hashFiles('package.json') == ''
        run: echo "No package.json yet (P0-BE-01 pending) — stage passes by design so CI is green from day one."

  migration-check:
    name: "Stage 2 — migration check"
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Drizzle migration check
        # packages/db must expose a "migration:check" script (P0-BE-06);
        # --if-present keeps this stage green until it exists.
        if: hashFiles('packages/db/package.json') != ''
        run: pnpm --dir packages/db run --if-present migration:check
      - name: Pre-scaffold pass
        if: hashFiles('packages/db/package.json') == ''
        run: echo "packages/db not scaffolded yet — stage passes by design."

  contract-tests:
    name: "Stage 3 — contract tests"
    needs: migration-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Contract tests (generated from packages/contracts/openapi.yaml)
        if: hashFiles('packages/contracts/openapi.yaml') != '' && hashFiles('package.json') != ''
        run: pnpm run --if-present test:contract
      - name: Pre-scaffold pass
        if: hashFiles('packages/contracts/openapi.yaml') == ''
        run: echo "packages/contracts/openapi.yaml not present yet (P0-BE-12 pending) — stage passes by design."

  unit-tests:
    name: "Stage 4 — unit business logic"
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Unit tests (posting rules · BOQ remain · retention · approval matrix · quota · 4-basis work periods)
        if: hashFiles('package.json') != ''
        run: pnpm run --if-present test:unit
      # B-378 (wei-approved): the line above runs `tests/unit` ONLY — 6 files, 48
      # cases. Every package suite (apps/api, apps/web, packages/db, and the rest)
      # hangs off `turbo run test`, which no stage invoked, so ~3,600 cases were
      # ungated: the pre-promote audit reverted a live money guard and watched all
      # six stages go green. @juneflow/tests is filtered out because its own `test`
      # script chains playwright e2e + visual, which need the compose stack Stage 5
      # brings up — running them here would fail for an environmental reason.
      - name: Package test suites (apps/api · apps/web · packages/*)
        if: hashFiles('package.json') != ''
        run: pnpm exec turbo run test --filter='!@juneflow/tests'
      - name: Pre-scaffold pass
        if: hashFiles('package.json') == ''
        run: echo "No package.json yet — stage passes by design."

  e2e:
    name: "Stage 5 — E2E (Playwright)"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Start dev stack (docker compose)
        if: hashFiles('infra/docker-compose.yml') != '' && hashFiles('tests/e2e/**') != ''
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - name: Install Playwright browsers
        if: hashFiles('tests/e2e/**') != '' && hashFiles('package.json') != ''
        run: pnpm --dir tests exec playwright install --with-deps chromium
      - name: E2E tests (state machine per docs/handoff/flows.html)
        if: hashFiles('tests/e2e/**') != '' && hashFiles('package.json') != ''
        run: pnpm run --if-present test:e2e
      - name: Stop dev stack
        if: always() && hashFiles('infra/docker-compose.yml') != ''
        env:
          COMPOSE_PROJECT_NAME: juneflow
        run: docker compose -f infra/docker-compose.yml down -v || true
      - name: Pre-scaffold pass
        if: hashFiles('tests/e2e/**') == ''
        run: echo "tests/e2e not present yet (P0-QA-03 pending) — stage passes by design."

  flutter-tests:
    name: "Stage 5b — mobile (Flutter)"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # B-378 (wei-approved): apps/mobile had NO stage at all. 1,043 tests and
      # `flutter analyze` were ungated, which is how a tautological phrase test
      # (B-382) let two staged sacred phrases go missing with the suite green.
      - name: Set up Flutter
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve packages
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        working-directory: apps/mobile
        run: flutter analyze
      - name: Tests
        if: hashFiles('apps/mobile/pubspec.yaml') != ''
        working-directory: apps/mobile
        run: flutter test
      - name: Pre-scaffold pass
        if: hashFiles('apps/mobile/pubspec.yaml') == ''
        run: echo "apps/mobile not scaffolded yet — stage passes by design."

  visual-gate:
    name: "Stage 6 — visual gate"
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
      - name: Start dev stack (docker compose)
        if: hashFiles('infra/docker-compose.yml') != '' && hashFiles('tests/visual/**') != ''
        # B-409: freeze the seed clock. Without an instant, B-323's deterministic
        # seeding still stamps from the wall clock, so date-bearing screens drift
        # further every day — measured on the live clock: 11 failing screens one
        # morning, 14 the same afternoon, with nothing dropping out.
        #
        # THE VALUE IS THE ONE B-409 MEASURED, AND THE CHOICE IS NOT SETTLED.
        # Wei's B-409 ruling is "freeze the clock for dms/gr-list" — freeze it so
        # that those two screens go green. This value does that: measured on the
        # lockfile's Playwright (B-413, repaired), dms and gr-list both pass under
        # it and the failing set is 12. Before that repair the same run measured
        # 9 — the browser build moved the count, which is why B-413 had to be
        # closed before any of these numbers could be trusted. Of the 9-era set,
        # one screen came and went across five fresh stacks; that one is B-412.
        #
        # A second, equally evidenced source disagrees about the instant:
        # tests/visual/screens.manifest.json records the pack's own provenance as
        # "FULL RE-BASELINE (2026-08-07) ... with SEED_FROZEN_NOW=2026-07-20T09:00:00Z
        # (B-224 - freezes the seed clock AND the ap/ar aging clock) ... then proven
        # strict-0". A previous revision of this step shipped that instant instead.
        # Measured, it fails 15 screens rather than 9 — dashboard passes, but seven
        # aging/date screens start failing, INCLUDING dms and gr-list, which are
        # the entire content of the approval above. (9 - 1 + 7 = 15 only if those
        # two are inside the seven, and they are.) So it was reverted, and the
        # conflict is filed as B-416 rather than settled in this comment. Do not
        # change this value on the strength of the provenance line alone.
        #
        # Either way a re-baseline is required: no instant reproduces this pack,
        # because B-323 changed the stamping ALGORITHM and not merely the clock.
        #
        # B-413 is repaired. The 12 above is post-repair, on the lockfile's
        # Playwright 1.61.1. The 15-vs-9 comparison ABOVE is NOT — both arms were
        # measured before the repair, and what carries there is their ORDERING
        # (this instant fails fewer than the provenance one), not the integers —
        # and AT MOST the ordering: the 15 was never re-measured after the repair,
        # which moved this instant's own count from 9 to 12.
        #
        # Scoped to THIS STEP on purpose (an `env:` on the step, which is narrower
        # than the job) — Stage 5's E2E was written against the live clock (see
        # B-404) and must not silently inherit a frozen one.
        env:
          SEED_FROZEN_NOW: "2026-08-07T12:22:42+07:00"
          # Named explicitly rather than left to compose's default, which is the
          # CHECKOUT DIRECTORY name. The gate step below joins this project's network
          # by name, and a rename of the working directory would silently break that
          # join rather than fail loudly.
          COMPOSE_PROJECT_NAME: juneflow
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - name: Visual gate, inside the image the pack was captured in (B-441)
        if: hashFiles('tests/visual/**') != '' && hashFiles('package.json') != ''
        # WHY A CONTAINER AND NOT THE RUNNER. This step used to install chromium onto
        # ubuntu-latest and run the gate there, and it failed 104 of 104 rows against
        # every pack ever captured — three re-baselines, on macOS, on emulated amd64
        # and on native amd64, all of them red.
        #
        # The cause is not which machine captures. It is that the same font FILE is
        # rasterised differently by different freetype/fontconfig versions. Measured,
        # one stack and one Playwright version, the ONLY variable being the OS base of
        # the image: playwright:v1.61.1-jammy against -noble differs by 19,003 of
        # 1,600,000 pixels on `login` — 1.19% — and the two do not even carry the same
        # Thai fonts (9 against 12). The runner is a third environment again.
        #
        # So the fix removes the variable instead of trying to match it: the pack is
        # captured in a pinned image and judged in the SAME pinned image, and the two
        # cannot drift because the tag is written down in one place
        # (tests/visual/gate-linux.sh, which must track the @playwright/test pin).
        #
        # The script also mints its own session INSIDE the compose network, which is
        # what B-411 and B-415 are about: the gate refuses to run without one, and
        # Playwright matches a storageState origin exactly, so a session minted for the
        # host's published port would capture 104 logged-out screens that fail in the
        # shape of drift.
        env:
          COMPOSE_PROJECT_NAME: juneflow
        run: bash tests/visual/gate-linux.sh
      - name: Stop dev stack
        if: always() && hashFiles('infra/docker-compose.yml') != ''
        run: docker compose -f infra/docker-compose.yml down -v || true
      - name: Pre-scaffold pass
        if: hashFiles('tests/visual/**') == ''
        run: echo "tests/visual not present yet (P0-BE-03 / P0-QA-04 pending) — stage passes by design."

  auto-merge-to-dev:
    name: "Auto-merge feature -> dev (CI green)"
    # Runs ONLY on pushes to feature/* branches after every stage above is green.
    # PLAN.md §10 review flow: feature -> dev (auto when CI green) -> main (Wei only).
    # main is locked: this job merges into dev ONLY and never pushes to main —
    # dev -> main promotion is done manually by Wei (branch protection on main).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    # B-378: `needs:` is the ONLY ordering GitHub Actions has, so a stage outside
    # this list executes and blocks nothing — it goes red AFTER the merge. The
    # first version of this commit added flutter-tests as a sibling leaf and
    # reproduced exactly the defect it exists to remove. Every gating stage must
    # appear here; visual-gate transitively covers stages 1-5.
    needs: [visual-gate, flutter-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge green feature branch into dev (gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          # Bootstrap case: create dev from this green feature commit if dev does not exist yet.
          if ! git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/dev"
            echo "dev branch did not exist — created from ${BRANCH}."
            exit 0
          fi
          git fetch origin dev
          if [ "$(git rev-list --count origin/dev..HEAD)" = "0" ]; then
            echo "No commits ahead of dev — nothing to merge."
            exit 0
          fi
          # Reuse an open PR if one exists, otherwise create it, then merge.
          PR_NUMBER="$(gh pr list --base dev --head "${BRANCH}" --state open --json number --jq '.[0].number' || true)"
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            gh pr create --base dev --head "${BRANCH}" \
              --title "auto-merge: ${BRANCH} -> dev (CI green)" \
              --body "Automated merge per PLAN.md §10 (feature -> dev when CI is green). main is promoted manually by Wei only."
            PR_NUMBER="$(gh pr list --base dev --head "${BRANCH}" --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "${PR_NUMBER}" --merge --delete-branch=false
