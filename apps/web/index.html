<!doctype html>
<!--
  data-theme="navy": the prototype forces the navy accent as the app-wide default
  (shell.jsx applyTweaks + "One-time migration: main accent set to navy per request.
  Force navy once", shell.jsx:34-43), so every gallery reference (tests/visual/reference)
  is navy. @juneflow/tokens exposes that exact palette as [data-theme="navy"]
  (#0B2A4A/#133E6B = ACCENT_PALETTES.navy). Required for the visual gate (PLAN.md section 0).
-->
<html lang="th" data-theme="navy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Design tokens come from @juneflow/tokens (navy accent) only - never hardcode values (PLAN.md section 0 rule 2) -->
    <!--
      Webfonts are SELF-HOSTED (B-440 = ก, Wei 2026-08-23). This used to <link> two
      preconnects and a stylesheet at fonts.googleapis.com, and that made what the app
      RENDERS depend on a third-party fetch:

        - the visual gate could never be stable. Measured, one browser and one stack,
          the ONLY variable being whether the CDN was reachable: `login` differed by
          130,840 of 1,600,000 pixels - 8.18%, against a CI gap of 1.42-3.74% that
          three separate re-baselines had failed to close;
        - `display=swap` meant the browser painted a fallback first and swapped later,
          so a screenshot landing in that window recorded the fallback;
        - and every page load told Google the user's IP. A Thai construction ERP that
          cannot draw Thai text without reaching Google does not work in a site office.

      public/fonts/fonts.css is Google's own css2 response for this exact family list
      with the URLs pointed at the copies in public/fonts/files/. Families still come
      from @juneflow/tokens - not hardcoded here.
    -->
    <link href="/fonts/fonts.css" rel="stylesheet" />
    <title>Juneflow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
