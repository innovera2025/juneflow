# Static analysis for juneflow_mobile — gate for P0-MOB-01 is `flutter analyze` green.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated code is never hand-edited (apps/mobile/CLAUDE.md):
    # - lib/theme/**.g.dart  : ThemeData generated by packages/tokens gen-flutter-theme (P0-MOB-02)
    # - lib/api/generated/** : Dart client generated from packages/contracts/openapi.yaml (P0-MOB-03)
    - "**/*.g.dart"
    - "lib/api/generated/**"

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
