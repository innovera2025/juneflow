# Juneflow mobile (Flutter) — Phase 0 skeleton only. Screens start Phase 4 (PLAN.md §7).
# Spec: PLAN.md Appendix A (Mobile row) + apps/mobile/CLAUDE.md
name: juneflow_mobile
description: Juneflow Construction ERP mobile app. Scaffold skeleton (P0-MOB-01); screens start Phase 4.
publish_to: "none"
version: 0.1.0

environment:
  # Floor raised to 3.8.0 by P0-MOB-03: the API-client codegen stack
  # (json_serializable/retrofit_generator) requires it. Host SDK is 3.12.x.
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP client that the GENERATED OpenAPI client (lib/api/**) runs on — retrofit
  # builds on dio. Client is codegen'd from packages/contracts/openapi.yaml
  # (P0-MOB-03); models are never hand-written (root CLAUDE.md).
  dio: ^5.4.0
  retrofit: ^4.9.2
  json_annotation: ^4.12.0
  # Offline-first local store + sync queue (PLAN.md Appendix A) — TODO(P0-MOB-05).
  # Offline level (a)/(b) is Open Question #5 (PLAN.md §11) — do not decide here.
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # API-client codegen (P0-MOB-03) — see tool/gen_api_client.sh.
  retrofit_generator: ^10.2.7
  json_serializable: ^6.14.0
  build_runner: ^2.15.1
  # Offline queue schema codegen (P0-MOB-05) — generates lib/offline/local_db.g.dart
  # from the drift table definitions. Never hand-edit the .g.dart output.
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
