# Juneflow mobile (Flutter) — Phase 0 skeleton only. Screens start Phase 4 (PLAN.md §7).
# Spec: PLAN.md Appendix A (Mobile row) + apps/mobile/CLAUDE.md
name: juneflow_mobile
description: Juneflow Construction ERP mobile app. Scaffold skeleton (P0-MOB-01); screens start Phase 4.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP client used by the generated OpenAPI Dart client — TODO(P0-MOB-03):
  # codegen from packages/contracts/openapi.yaml (never hand-write models).
  dio: ^5.4.0
  # Offline-first local store + sync queue (PLAN.md Appendix A) — TODO(P0-MOB-05).
  # Offline level (a)/(b) is Open Question #5 (PLAN.md §11) — do not decide here.
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # TODO(P0-MOB-05): add drift_dev + build_runner when the offline queue schema lands.

flutter:
  uses-material-design: true
